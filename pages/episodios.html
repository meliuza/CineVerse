<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>CineVerse</title>
    <link rel="stylesheet" href="../css/episodios.css">

    <link rel="stylesheet" href="../css/navbar.css">

    <link rel="stylesheet" href="../css/pesquisa.css">

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- ========================================= -->
    <!-- NAVBAR -->
    <!-- ========================================= -->

    <header id="navbar"></header>


    <!-- ========================================= -->
    <!-- CONTEÚDO -->
    <!-- ========================================= -->

    <main class="episodiosPagina">

        <!-- CAPA -->

        <section
            class="episodiosHero"
            id="episodiosHero"
        >

            <div class="episodiosHeroImagem">

                <img
                    id="episodiosBanner"
                    src=""
                    alt=""
                >

            </div>


            <div class="episodiosHeroInfo">

                <h1 id="episodiosTitulo">
                    Carregando...
                </h1>

                <p id="episodiosDescricao"></p>

                <div
                    class="episodiosMeta"
                    id="episodiosMeta"
                ></div>

            </div>

        </section>


        <!-- ===================================== -->
        <!-- LISTA DE TEMPORADAS / EPISÓDIOS -->
        <!-- ===================================== -->

        <section class="episodiosConteudo">

            <div
                class="temporadas"
                id="temporadas"
            ></div>

            <div
                class="listaEpisodios"
                id="listaEpisodios"
            ></div>

        </section>

    </main>


    <!-- ========================================= -->
    <!-- SCRIPTS -->
    <!-- ========================================= -->

    <script src="../js/catalogo.js"></script>

    <script src="../js/conteudos/novela.js"></script>

    <script src="../js/conteudos/serie.js"></script>

    <script src="../js/conteudos/anime.js"></script>

    <script src="../js/conteudos/dorama.js"></script>

    <script src="../js/navbar.js"></script>

    <script src="../js/episodios.js"></script>

</body>

</html>
